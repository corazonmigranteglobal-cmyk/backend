info:
  title: Corazón Migrante API
  description: |-
    API HTTP del backend de Corazón Migrante: agenda terapéutica, catálogo, contenidos
    editoriales, publicidad, descargables, contabilidad y administración del sitio público.

    ## Sobre de respuesta

    Todas las respuestas de éxito viajan envueltas por `ResponseInterceptor`:
    `{ "data": ..., "meta": { "requestId", "timestamp" } }`. Los listados paginados añaden
    `pagination`. Los errores los normaliza `HttpExceptionFilter` a
    `{ "error": { "code", "message", "details" }, "meta": { ... } }`.

    Ramifica siempre por `error.code`, nunca por `error.message`: los mensajes son texto
    para la persona usuaria y pueden cambiar sin previo aviso.

    ## Autenticación

    Las operaciones marcadas con candado requieren `Authorization: Bearer <accessToken>`.
    El token se obtiene en `POST /api/v1/auth/login` y se renueva en
    `POST /api/v1/auth/refresh`. Cada operación protegida documenta en su descripción los
    roles y permisos concretos que exige.

    ## Límite de peticiones

    `ThrottlerGuard` es global: 120 peticiones por minuto y dirección IP. Las operaciones
    sensibles (login, registro, restablecimiento de contraseña) declaran límites más
    estrictos, indicados en su descripción.
  version: 1.0.0
  contact:
    name: Equipo Corazón Migrante
    url: ""
    email: cpacentropreparacionacademica@gmail.com
  license:
    name: LicenseRef-Propietaria
    url: https://corazonmigrante.com
tags:
  - name: Auth
    description: Registro, inicio de sesión, rotación de tokens y restablecimiento de contraseña.
  - name: Usuarios
    description: Cuentas, perfiles de paciente y terapeuta, y asignación de roles.
  - name: Citas
    description: "Ciclo de vida de las citas: reserva, confirmación, atención, pago y cancelación."
  - name: Agenda
    description: "Disponibilidad de terapeutas: horarios, bloqueos y búsqueda de huecos reservables."
  - name: Catálogo terapéutico
    description: Productos terapéuticos y enfoques ofrecidos por el centro.
  - name: Contenido
    description: Publicaciones editoriales, taxonomía, personas suscriptoras y acceso a contenido premium.
  - name: Publicidad
    description: Empresas anunciantes, campañas, creatividades, emplazamientos e impresiones.
  - name: CMS
    description: Páginas y elementos editables del sitio público.
  - name: Portada
    description: "Composición de la portada pública: secciones y elementos destacados."
  - name: Archivos
    description: Subida, descarga, firma temporal y control de acceso de archivos.
  - name: Descargables
    description: Recursos descargables, derechos de acceso e integración con la pasarela de pago Hotmart.
  - name: Contabilidad
    description: Plan de cuentas, asientos, transacciones, ventas y centros de coste.
  - name: Analítica
    description: Eventos de interfaz del sitio público y visitas agregadas.
  - name: Mensajería
    description: "Outbox transaccional de correo: consulta, reproceso y pruebas de proveedor."
  - name: Notificaciones
    description: Notificaciones dirigidas al panel administrativo.
  - name: Auditoría
    description: Consulta del registro de auditoría del sistema.
  - name: Salud
    description: Sondas de vida y disponibilidad para orquestadores y balanceadores.
  - name: Compatibilidad legacy
    description: Rutas conservadas para clientes antiguos que aún no han migrado.
servers:
  - url: https://api.corazonmigrante.com
    description: Producción
  - url: http://localhost:3000
    description: Desarrollo local
components:
