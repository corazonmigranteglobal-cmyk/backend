      type: object
      properties:
        email:
          type: string
          example: terapeuta@example.com
        password:
          type: string
          example: Demo123456!
        firstName:
          type: string
          example: Lucía
        lastName:
          type: string
          example: Mendoza
        phone:
          type: string
          example: "+59170000001"
        title:
          type: string
          example: Psicóloga
        mainSpecialty:
          type: string
          example: Terapia familiar
        bio:
          type: string
        personalPhrase:
          type: string
        youtubeUrl:
          type: string
        licenseNumber:
          type: string
          example: MAT-12345
        country:
          type: string
          example: Bolivia
        city:
          type: string
          example: Santa Cruz de la Sierra
        baseSessionPrice:
          type: number
          example: 180
      required:
        - email
        - password
        - firstName
        - lastName
        - title
        - mainSpecialty
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: paciente.demo@corazonmigrante.test
        password:
          type: string
          example: Demo123456!
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    RequestPasswordResetDto:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
        pin:
          type: string
          example: "123456"
        newPassword:
          type: string
          example: NuevaClave123!
      required:
        - email
        - pin
        - newPassword
    UpdatePatientProfileDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        birthDate:
          type: string
        country:
          type: string
        city:
          type: string
        occupation:
