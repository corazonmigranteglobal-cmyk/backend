        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        coverUrl:
          type: string
        fileUrl:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        visibility:
          type: string
          enum: *a37
        requiresPremium:
          type: boolean
        requiresPurchase:
          type: boolean
        status:
          type: string
          enum:
            - DRAFT
            - IN_REVIEW
            - CHANGES_REQUESTED
            - APPROVED
            - PUBLISHED
            - ARCHIVED
            - REJECTED
    HotmartConfigDto:
      type: object
      properties:
        hotmartProductId:
          type: string
        hotmartOfferId:
          type: string
        hotmartCheckoutUrl:
          type: string
        externalReference:
          type: string
    CreateVersionDto:
      type: object
      properties:
        changeReason:
          type: string
    ReviewCommentDto:
      type: object
      properties:
        comment:
          type: string
    GrantEntitlementDto:
      type: object
      properties:
        userId:
          type: string
        subjectEmail:
          type: string
    AttachPublicationDto:
      type: object
      properties:
        resourceId:
          type: string
        label:
          type: string
        isPrimary:
          type: boolean
        sortOrder:
          type: number
      required:
        - resourceId
    HotmartNotificationDto:
      type: object
      properties:
        eventId:
          type: string
        productId:
          type: string
        buyerEmail:
          type: string
        buyerUserId:
          type: string
        status:
          type: string
        externalReference:
          type: string
      required:
        - eventId
        - productId
        - status
    ApiErrorDto:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
          description: Código estable y legible por máquina. Los clientes deben ramificar por este campo, nunca por `message`.
        message:
          type: string
          example: La solicitud contiene datos con un formato invalido.
          description: Mensaje en español orientado a la persona usuaria final.
        details:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Detalles del fallo. En errores de validación contiene un elemento por campo rechazado con `field` y `constraints`; en el resto de errores puede venir vacío.
          example:
            - field: email
              constraints:
                isEmail: email must be an email
      required:
        - code
        - message
        - details
    ResponseMetaDto:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          example: 3f1c8a52-9d47-4a0b-8f21-6d5c0f1e2b7a
          description: Identificador de la petición. Se toma de la cabecera `X-Request-Id` cuando el cliente la envía y, si no, lo genera el servidor. Se devuelve también en la cabecera `X-Request-Id`.
        timestamp:
          type: string
          format: date-time
          example: 2026-08-03T19:45:12.345Z
          description: Instante UTC en que el servidor serializó la respuesta.
      required:
        - requestId
        - timestamp
    ApiErrorResponseDto:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorDto"
        meta:
          $ref: "#/components/schemas/ResponseMetaDto"
      required:
        - error
        - meta
    PaginationMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
          description: Página devuelta. La numeración empieza en 1.
        limit:
          type: number
          example: 20
          description: Número máximo de elementos por página.
        total:
          type: number
          example: 137
          description: Total de elementos que cumplen el filtro.
        totalPages:
          type: number
          example: 7
          description: Total de páginas disponibles con el `limit` actual.
      required:
        - page
        - limit
        - total
        - totalPages
    ApiSuccessResponseDto:
      type: object
      properties:
        data:
          type: object
          description: Carga útil de la operación.
          additionalProperties: true
        pagination:
          description: Presente únicamente en los listados paginados, es decir cuando el handler devuelve `{ items, pagination }`.
          allOf:
            - $ref: "#/components/schemas/PaginationMetaDto"
        meta:
          $ref: "#/components/schemas/ResponseMetaDto"
      required:
        - meta
  responses:
    BadRequest:
      description: La solicitud no supera la validación. `details` enumera los campos rechazados. `ValidationPipe` corre con `whitelist` y `forbidNonWhitelisted`, así que enviar una propiedad no declarada también produce este error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponseDto"
          example:
            error:
              code: VALIDATION_ERROR
              message: La solicitud contiene datos con un formato invalido.
              details: []
            meta:
              requestId: 3f1c8a52-9d47-4a0b-8f21-6d5c0f1e2b7a
              timestamp: 2026-08-03T19:45:12.345Z
      headers:
        X-Request-Id:
          description: Identificador de la petición, para correlacionar con los logs del servidor.
          schema:
            type: string
            format: uuid
        x-trace-id:
          description: Identificador de la traza OpenTelemetry asociada a la petición.
          schema:
            type: string
    Unauthorized:
      description: Falta el token de acceso, está expirado o no es válido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponseDto"
          example:
            error:
              code: UNAUTHORIZED
              message: Token de acceso inválido o expirado.
              details: []
            meta:
              requestId: 3f1c8a52-9d47-4a0b-8f21-6d5c0f1e2b7a
              timestamp: 2026-08-03T19:45:12.345Z
      headers:
        X-Request-Id:
          description: Identificador de la petición, para correlacionar con los logs del servidor.
          schema:
            type: string
            format: uuid
        x-trace-id:
          description: Identificador de la traza OpenTelemetry asociada a la petición.
          schema:
            type: string
    Forbidden:
      description: El token es válido pero la identidad no tiene el rol o permiso que exige la operación.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponseDto"
          example:
            error:
              code: FORBIDDEN
              message: No tienes permisos para realizar esta acción.
              details: []
            meta:
              requestId: 3f1c8a52-9d47-4a0b-8f21-6d5c0f1e2b7a
              timestamp: 2026-08-03T19:45:12.345Z
      headers:
        X-Request-Id:
          description: Identificador de la petición, para correlacionar con los logs del servidor.
          schema:
            type: string
            format: uuid
        x-trace-id:
          description: Identificador de la traza OpenTelemetry asociada a la petición.
          schema:
            type: string
    NotFound:
