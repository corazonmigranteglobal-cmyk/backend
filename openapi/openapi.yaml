    bearerAuth:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: "Token de acceso emitido por `POST /api/v1/auth/login`. Vida útil por defecto: 15 minutos."
  schemas:
    SendTestEmailDto:
      type: object
      properties: {}
    RegisterPatientDto:
      type: object
      properties:
        email:
          type: string
          example: nuevo@example.com
        password:
          type: string
          example: Demo123456!
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: Rojas
        phone:
          type: string
          example: "+59170000000"
        birthDate:
          type: string
          example: 1998-01-20
        country:
          type: string
          example: Bolivia
        city:
          type: string
          example: Santa Cruz de la Sierra
        occupation:
          type: string
          example: Estudiante
      required:
        - email
        - password
        - firstName
        - lastName
