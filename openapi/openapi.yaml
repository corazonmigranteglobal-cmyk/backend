    get:
      operationId: AdminDownloadablesController_list
      parameters:
        - name: page
          required: false
          in: query
          description: Página actual. Empieza en 1.
          schema:
            example: 1
            type: number
        - name: p_page
          required: false
          in: query
          description: Alias legacy aceptado por compatibilidad con frontends antiguos. Si page también llega, page tiene prioridad.
          schema:
            example: 1
            type: number
        - name: pageSize
          required: false
          in: query
          description: Cantidad de registros por página. Nombre histórico del frontend.
          schema:
            example: 20
            type: number
        - name: limit
          required: false
          in: query
          description: Cantidad de registros por página. Nombre recomendado por contratos actuales.
          schema:
            example: 20
            type: number
        - name: p_limit
          required: false
          in: query
          description: Alias legacy aceptado para tamaño de página. Si limit o pageSize también llegan, limit/pageSize tienen prioridad.
          schema:
            example: 20
            type: number
        - name: sort
          required: false
          in: query
          description: Campo de ordenamiento. Se aceptan aliases camelCase y snake_case conocidos; valores no permitidos se reemplazan por el default seguro del endpoint.
          schema:
            example: createdAt
            type: string
        - name: sortBy
          required: false
          in: query
          description: Alias usado por algunas tablas del frontend. sort tiene prioridad cuando ambos llegan.
          schema:
            example: created_at
            type: string
        - name: order
          required: false
          in: query
          schema:
            example: desc
            type: string
            enum:
              - asc
              - desc
        - name: sortDir
          required: false
          in: query
          description: Alias usado por algunas tablas del frontend. order tiene prioridad cuando ambos llegan.
          schema:
            example: desc
            type: string
            enum:
              - asc
              - desc
        - name: search
          required: false
          in: query
          schema:
            example: ansiedad
            type: string
        - name: q
          required: false
          in: query
          description: Alias corto para búsqueda. search tiene prioridad.
          schema:
            example: lucia
            type: string
        - name: status
          required: false
          in: query
          description: Filtro genérico de estado. En endpoints de usuarios también acepta activo/inactivo/pendiente/bloqueado.
          schema:
            example: ACTIVE
            type: string
        - name: estado
          required: false
          in: query
          description: Alias español para status. status tiene prioridad.
          schema:
            example: activo
            type: string
        - name: p_estado
          required: false
          in: query
          description: Alias legacy español para status. status/estado tienen prioridad.
          schema:
            example: activo
            type: string
        - name: role
          required: false
          in: query
          description: Filtro genérico de rol para endpoints que lo soporten. En usuarios acepta THERAPIST/TERAPEUTA, PATIENT/PACIENTE, ACCOUNTANT/CONTADOR, etc.
          schema:
            example: THERAPIST
            type: string
        - name: rol
          required: false
          in: query
          description: Alias español para role.
          schema:
            example: TERAPEUTA
            type: string
        - name: p_rol
          required: false
          in: query
          description: Alias legacy español para role.
          schema:
            example: TERAPEUTA
            type: string
        - name: tipo_usuario
          required: false
          in: query
          description: Alias legacy para role/tipo de usuario.
