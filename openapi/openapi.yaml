        - name: rol
          required: false
          in: query
          description: Alias español para role.
          schema:
            example: TERAPEUTA
            type: string
        - name: p_rol
          required: false
          in: query
          description: Alias legacy español para role.
          schema:
            example: TERAPEUTA
            type: string
        - name: tipo_usuario
          required: false
          in: query
