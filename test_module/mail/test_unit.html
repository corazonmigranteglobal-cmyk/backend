<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Email Sender</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 12px; }
    label { display:block; margin: 10px 0 6px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; box-sizing: border-box; }
    button { padding: 10px 14px; cursor: pointer; margin-top: 12px; }
    pre { background: #f7f7f7; padding: 12px; overflow:auto; }
    .row { display:flex; gap: 12px; }
    .col { flex: 1; }
    .hint { color:#666; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Enviar correo (prueba)</h1>

  <div class="row">
    <div class="col">
      <label for="apiKey">x-api-key (opcional)</label>
      <input id="apiKey" placeholder="Si activaste EMAIL_SEND_API_KEY en backend, pégala aquí" />
      <div class="hint">Si tu backend valida API key y no la envías, te dará 401.</div>
    </div>
    <div class="col">
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" value="/api/email/send" />
      <div class="hint">Si tu server corre en otro host/puerto, pon la URL completa.</div>
    </div>
  </div>

  <label for="to">Destinatario (to)</label>
  <input id="to" type="email" placeholder="usuario@gmail.com" />

  <label for="subject">Asunto</label>
  <input id="subject" placeholder="Mensaje de prueba" />

  <label for="text">Mensaje</label>
  <textarea id="text" rows="6" placeholder="Hola! Esto es un correo de prueba."></textarea>

  <button id="sendBtn">Enviar</button>

  <h3>Resultado</h3>
  <pre id="out">{}</pre>

  <script type="module" src="./test_unit.js"></script>
</body>
</html>
