services:
  postgres:
    image: postgres:16-alpine
    container_name: corazon_migrante_postgres
    environment:
      POSTGRES_DB: corazon_migrante
      POSTGRES_USER: corazon
      POSTGRES_PASSWORD: corazon
    # El puerto del host es configurable porque una instalación nativa de
    # PostgreSQL en la máquina de desarrollo se queda con el 5432 y Docker no
    # avisa del conflicto: publica el mapeo igualmente y las conexiones acaban
    # en el servidor equivocado. Exporta `POSTGRES_HOST_PORT` para reubicarlo.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corazon -d corazon_migrante"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: corazon_migrante_redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: corazon_migrante_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start:prod"

volumes:
  postgres_data:
