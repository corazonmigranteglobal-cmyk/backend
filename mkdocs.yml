site_name: Corazón Migrante — Backend
site_description: Documentación técnica del backend de Corazón Migrante
docs_dir: docs
site_dir: site

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Cambiar a modo oscuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Cambiar a modo claro }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid nativo de Material: no hace falta plugin externo.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search: { lang: es }

validation:
  nav:
    omitted_files: ignore
  links:
    # Buena parte del valor de esta documentación son los enlaces al código que
    # sostiene cada afirmación (`../../src/...`). MkDocs sólo resuelve enlaces
    # dentro de `docs/`, así que los marcaría todos como rotos.
    #
    # La comprobación no se pierde: `yarn docs:links` los valida contra el
    # sistema de archivos real —incluidos los que salen de `docs/`—, que es una
    # verificación más fuerte que la de MkDocs, y falla en CI si alguno no existe.
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
