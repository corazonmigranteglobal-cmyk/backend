      - Decisiones (ADR): adr/index.md
      - ADR-0003 · ORM y modelo de datos: adr/ADR-0003-orm-y-modelo-de-datos.md
      - ADR-0015 · Interoperabilidad de módulos: adr/ADR-0015-interoperabilidad-de-modulos.md
  - Negocio:
      - Flujos críticos: business/critical-workflows.md
  - Módulos:
      - Índice: modules/index.md
      - accounting: modules/accounting.md
      - advertising: modules/advertising.md
      - analytics: modules/analytics.md
      - appointments: modules/appointments.md
      - audit: modules/audit.md
      - auth: modules/auth.md
      - cms: modules/cms.md
      - content: modules/content.md
      - downloadables: modules/downloadables.md
      - files: modules/files.md
      - health: modules/health.md
      - homepage: modules/homepage.md
      - legacy-compatibility: modules/legacy-compatibility.md
      - messaging: modules/messaging.md
      - notifications: modules/notifications.md
      - roles-permissions: modules/roles-permissions.md
      - scheduling: modules/scheduling.md
