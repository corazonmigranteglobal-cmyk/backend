  /admin/audit/logs:
    get:
      tags: [Audit]
      summary: Listar logs de auditoría
      description: Requiere rol `ADMIN` o `SUPER_ADMIN` y permiso `audit:read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }

  /legacy/status:
    get:
      tags: [Legacy compatibility]
      summary: Estado de compatibilidad legacy
      description: Público. Indica si el módulo temporal de rutas legacy está activo.
      security: []
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Página actual. Tiene prioridad sobre `p_page`.
    PPage:
      name: p_page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
      description: Alias legacy aceptado para paginación. `page` tiene prioridad cuando ambos llegan.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Tamaño de página histórico.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Tamaño de página recomendado para frontend/smoke. Tiene prioridad sobre `pageSize` y `p_limit`.
    PLimit:
      name: p_limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
      description: Alias legacy aceptado para tamaño de página. `limit` y `pageSize` tienen prioridad cuando llegan juntos.
    Search:
      name: search
      in: query
      required: false
      schema: { type: string }
      description: Búsqueda textual canónica.
    Q:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Alias corto para búsqueda. `search` tiene prioridad cuando ambos llegan.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string, default: createdAt }
      description: Campo de orden. El backend normaliza alias camelCase/snake_case seguros y evita ORDER BY con columnas inexistentes.
    SortBy:
      name: sortBy
      in: query
      required: false
      schema: { type: string }
      description: Alias frontend para `sort`. `sort` tiene prioridad si ambos llegan.
    Order:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
    SortDir:
      name: sortDir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
      description: Alias frontend para `order`. `order` tiene prioridad si ambos llegan.
    Status:
      name: status
      in: query
      required: false
      schema: { type: string }
      description: Filtro canónico de estado. En usuarios acepta ACTIVE/INACTIVE/BLOCKED/PENDING y aliases activo/inactivo/bloqueado/pendiente.
    Estado:
      name: estado
      in: query
      required: false
      schema: { type: string }
      description: Alias español para `status`.
    PEstado:
      name: p_estado
      in: query
      required: false
      schema: { type: string }
      description: Alias legacy español para `status`.
    Role:
      name: role
      in: query
      required: false
      schema: { type: string }
      description: Filtro canónico de rol. En usuarios acepta THERAPIST/TERAPEUTA, PATIENT/PACIENTE, ACCOUNTANT/CONTADOR, ADMIN y SUPER_ADMIN.
    Rol:
      name: rol
      in: query
      required: false
      schema: { type: string }
      description: Alias español para `role`.
    PRol:
      name: p_rol
      in: query
      required: false
      schema: { type: string }
      description: Alias legacy español para `role`.
    TipoUsuario:
      name: tipo_usuario
      in: query
      required: false
      schema: { type: string }
      description: Alias legacy para `role`.

  responses:
    OkEnvelope:
      description: Respuesta exitosa envuelta en `{ data, meta }`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeObject' }
    CreatedEnvelope:
      description: Recurso creado. Respuesta envuelta en `{ data, meta }`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeObject' }
    PaginatedEnvelope:
      description: Lista paginada envuelta en `{ data, pagination, meta }`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    ValidationError:
      description: Error de validación o contrato de entrada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: HTTP_400
              message:
                - property debug should not exist
              details:
                - property debug should not exist
            meta:
              requestId: 315c2096-df71-447a-92ad-2f9329316896
              timestamp: '2026-07-05T15:13:13.536Z'
    UnauthorizedError:
      description: Token ausente, vencido o inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ForbiddenError:
      description: Usuario autenticado sin rol o permiso suficiente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFoundError:
      description: Recurso no encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConflictError:
      description: Conflicto de unicidad, solapamiento o regla de negocio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequestsError:
      description: Límite de solicitudes excedido (rate limiting).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: HTTP_429
              message: 'ThrottlerException: Too Many Requests'
              details: []
            meta:
              requestId: 315c2096-df71-447a-92ad-2f9329316896
              timestamp: '2026-07-05T15:13:13.536Z'

  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
    EnvelopeObject:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - type: object
              nullable: true
            - type: array
              items: {}
            - type: string
            - type: boolean
            - type: number
        meta: { $ref: '#/components/schemas/Meta' }
    Pagination:
      type: object
      required: [page, pageSize, limit, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 138 }
        totalPages: { type: integer, example: 7 }
    PaginatedEnvelope:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items: {}
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, example: HTTP_400 }
            message:
              oneOf:
                - type: string
                - type: array
                  items: { type: string }
            details:
              type: array
              items: {}
        meta: { $ref: '#/components/schemas/Meta' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmRequest:
      type: object
      required: [email, pin, newPassword]
      properties:
        email: { type: string, format: email }
        pin: { type: string, minLength: 6, maxLength: 6, example: '123456' }
        newPassword: { type: string, format: password, minLength: 8 }
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            role: { type: string }
            permissions:
              type: array
              items: { type: string }

    RegisterPatientRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        birthDate: { type: string, format: date }
        country: { type: string }
        city: { type: string }
        occupation: { type: string }
    RegisterTherapistRequest:
      type: object
      required: [email, password, firstName, lastName, title, mainSpecialty]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        title: { type: string }
        mainSpecialty: { type: string }
        bio: { type: string }
        personalPhrase: { type: string }
        youtubeUrl: { type: string, format: uri }
        licenseNumber: { type: string }
        country: { type: string }
        city: { type: string }
        baseSessionPrice: { type: number, minimum: 0 }
    UpdatePatientProfileRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        birthDate: { type: string, format: date }
        country: { type: string }
        city: { type: string }
        occupation: { type: string }
    UpdateTherapistProfileRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        title: { type: string }
        mainSpecialty: { type: string }
        bio: { type: string }
        personalPhrase: { type: string }

    CreateApproachRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer }
    CreateProductRequest:
      type: object
      required: [approachId, name, durationMinutes, price]
      properties:
        approachId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 15, maximum: 240, example: 60 }
        price: { type: number, minimum: 0, example: 180 }
        currency: { type: string, example: BOB }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer }

    CreateScheduleRequest:
      type: object
      required: [weekday, startTime, endTime, timezone, effectiveFrom]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Día de semana. 0 domingo, 1 lunes, ..., 6 sábado.
        startTime: { type: string, pattern: '^\d{2}:\d{2}$', example: '09:00' }
        endTime: { type: string, pattern: '^\d{2}:\d{2}$', example: '13:00' }
        timezone: { type: string, example: America/La_Paz }
        effectiveFrom: { type: string, format: date, example: '2026-07-01' }
        effectiveTo: { type: string, format: date, nullable: true }
    CreateBlockedTimeRequest:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string }
    AvailabilityResponse:
      type: object
      required: [therapistUserId, productId, slots]
      properties:
        therapistUserId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        slots:
          type: array
          items:
            type: object
            required: [startAt, endAt, timezone]
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
              timezone: { type: string, example: America/La_Paz }

    CreateAppointmentRequest:
      type: object
      required: [therapistUserId, productId, scheduledStartAt, timezone]
      properties:
        therapistUserId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        scheduledStartAt: { type: string, format: date-time }
        timezone: { type: string, example: America/La_Paz }
        notesForTherapist: { type: string }
    UpdateAppointmentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, COMPLETED, CANCELLED_BY_PATIENT, CANCELLED_BY_ADMIN, CANCELLED_BY_THERAPIST, NO_SHOW]
        reason: { type: string }

    CreateCmsPageRequest:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string, example: inicio }
        title: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        seoMetadata: { type: object, additionalProperties: true }
    CreateCmsElementRequest:
      type: object
      required: [code, type, content]
      properties:
        code: { type: string, example: hero }
        type: { type: string, example: JSON }
        content: { type: object, additionalProperties: true }
        sortOrder: { type: integer }

    CreatePublicationRequest:
      type: object
      required: [authorId, categoryId, title, summary, body]
      properties:
        authorId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        coverFileId: { type: string, format: uuid }
        title: { type: string, minLength: 4, maxLength: 220 }
        slug:
          type: string
          minLength: 4
          maxLength: 240
          description: Si se omite, el backend lo genera desde el título.
        summary: { type: string, minLength: 10, maxLength: 1000 }
        body: { type: string, minLength: 20, maxLength: 50000 }
        audioTranscript: { type: string }
        publicationType: { type: string, enum: [NEWS, COLUMN, OPINION, INTERVIEW, REPORT, ANALYSIS], default: NEWS }
        accessType: { type: string, enum: [PUBLIC, PREMIUM, INTERNAL_ONLY], default: PUBLIC }
        scheduledAt: { type: string, format: date-time }
        commentsEnabled: { type: boolean, default: true }
        reactionsEnabled: { type: boolean, default: true }
        tagIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        seoMetadata: { type: object, additionalProperties: true }
    UpdatePublicationRequest:
      type: object
      properties:
        authorId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        coverFileId: { type: string, format: uuid }
        title: { type: string, minLength: 4, maxLength: 220 }
        slug:
          type: string
          minLength: 4
          maxLength: 240
        summary: { type: string, minLength: 10, maxLength: 1000 }
        body: { type: string, minLength: 20, maxLength: 50000 }
        audioTranscript: { type: string }
        publicationType: { type: string, enum: [NEWS, COLUMN, OPINION, INTERVIEW, REPORT, ANALYSIS] }
        accessType: { type: string, enum: [PUBLIC, PREMIUM, INTERNAL_ONLY] }
        scheduledAt: { type: string, format: date-time }
        commentsEnabled: { type: boolean }
        reactionsEnabled: { type: boolean }
        tagIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        seoMetadata: { type: object, additionalProperties: true }
    CreateContentCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    UpdateContentCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    CreateContentTagRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, minLength: 2, maxLength: 100 }
    CreateContentAuthorRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 180 }
        userId: { type: string, format: uuid }
        headline: { type: string, minLength: 2, maxLength: 220 }
        bio: { type: string }
        avatarFileId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        metadata: { type: object, additionalProperties: true }
    UpdateContentAuthorRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 180 }
        userId: { type: string, format: uuid }
        headline: { type: string, minLength: 2, maxLength: 220 }
        bio: { type: string }
        avatarFileId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        metadata: { type: object, additionalProperties: true }

    UpdateHomepageLayoutRequest:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          maxItems: 20
          items:
            type: object
            required: [code, title, type]
            properties:
              code: { type: string }
              title: { type: string }
              type: { type: string, enum: [HEADLINES, COLUMNS, ADS, CUSTOM] }
              sortOrder: { type: integer, minimum: 0 }
              isActive: { type: boolean }
              metadata: { type: object, additionalProperties: true }
              items:
                type: array
                maxItems: 30
                items:
                  type: object
                  required: [itemType, itemId]
                  properties:
                    itemType: { type: string, enum: [CONTENT_PUBLICATION, ADS_CAMPAIGN, ADS_CREATIVE] }
                    itemId: { type: string, format: uuid }
                    sortOrder: { type: integer, minimum: 0 }
                    metadata: { type: object, additionalProperties: true }

    CreateAdsCompanyRequest:
      type: object
      required: [businessName, commercialName]
