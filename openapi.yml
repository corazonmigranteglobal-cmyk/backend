        companyId: { type: string, format: uuid }
        name: { type: string }
        objective: { type: string, enum: [AWARENESS, TRAFFIC, PUBLIC_SERVICE, SPONSORSHIP] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        budgetAmount: { type: number, minimum: 0 }
        currency: { type: string, example: BOB, minLength: 3, maxLength: 3 }
        priority: { type: integer, minimum: 1, maximum: 1000 }
        placementIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        notes: { type: string }
    UpdateAdsCampaignRequest:
      type: object
      properties:
        companyId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 180 }
        objective: { type: string, enum: [AWARENESS, TRAFFIC, PUBLIC_SERVICE, SPONSORSHIP] }
