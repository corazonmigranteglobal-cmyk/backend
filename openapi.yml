openapi: 3.0.3
info:
  title: Corazón Migrante API
  version: 1.0.0
  description: |
    API pública y administrativa de Corazón Migrante.

    Prefijo global: `/api/v1`.

    Contrato de respuesta:
    - Respuesta simple: `{ data, meta }`.
    - Respuesta paginada: `{ data, pagination, meta }`.
    - Error: `{ error: { code, message, details }, meta }`.

    Seguridad:
    - Los endpoints públicos están marcados como `public` en su descripción.
    - Los endpoints privados usan `Bearer JWT`.
    - Algunos endpoints administrativos requieren permisos específicos además del rol.

    Disponibilidad de terapeutas:
    - `GET /booking/availability` calcula los horarios disponibles por terapeuta.
    - Parte de los horarios recurrentes configurados en `therapist_schedules`.
    - Resta bloqueos activos de agenda (`therapist_blocked_times`).
    - Resta citas activas/ocupadas (`appointments` con status `REQUESTED` o `CONFIRMED`).
    - El rango máximo soportado es 31 días.

    Límites de uso (rate limiting):
    - Límite global por IP: 120 solicitudes / 60s. Al excederlo, la API responde `429`
      con `{ error: { code: "HTTP_429", ... } }`.
    - `POST /auth/login`, `/auth/register/*`: 10 solicitudes / 60s por IP.
    - `POST /auth/password-reset/request` y `/confirm`: 5 solicitudes / 60s por IP.
    - El cuerpo de las solicitudes JSON está limitado a 2 MB (`413` si se excede).
servers:
  - url: https://api.corazondemigrante.com/api/v1
    description: Producción
  - url: http://localhost:3000/api/v1
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Therapy public catalog
  - name: Admin therapy catalog
  - name: Scheduling
  - name: Booking
  - name: Appointments
  - name: Files
  - name: Public CMS
  - name: Admin CMS
  - name: Publications public
  - name: Content admin
  - name: Homepage public
  - name: Homepage admin
  - name: Advertising public
  - name: Advertising admin
  - name: Accounting
  - name: Analytics
  - name: Messaging
  - name: Audit
  - name: Legacy compatibility

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check público
      description: Endpoint público para health checks de Render, balanceadores o monitoreo.
      security: []
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeObject'
              example:
                data:
                  ok: true
                  service: corazon-migrante-backend
                meta:
                  requestId: 8f04fb1e-c6cc-4d76-a661-741765c8f360
                  timestamp: '2026-07-05T15:13:13.536Z'

  /auth/register/patient:
    post:
      tags: [Auth]
      summary: Registrar paciente
      description: Público. Crea usuario con rol de paciente y su perfil inicial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /auth/register/therapist:
    post:
      tags: [Auth]
      summary: Registrar terapeuta
      description: Público. Crea usuario terapeuta y perfil profesional inicial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTherapistRequest'
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Público. Devuelve tokens de acceso y refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: paciente.demo@corazonmigrante.test
              password: Demo123456!
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeObject'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: Público. Usa un refresh token válido para emitir una nueva sesión.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Público. Invalida el refresh token enviado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicitar recuperación de contraseña
      description: Público. Encola o envía instrucciones de recuperación si el correo existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirmar recuperación de contraseña
      description: Público. Cambia contraseña usando token de recuperación válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  /me:
    get:
      tags: [Users]
      summary: Obtener perfil de sesión
      description: Requiere autenticación. Devuelve usuario, rol, permisos y perfiles asociados.
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /me/patient-profile:
    patch:
      tags: [Users]
      summary: Actualizar perfil de paciente
      description: Requiere rol `PATIENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientProfileRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /me/therapist-profile:
    patch:
      tags: [Users]
      summary: Actualizar perfil de terapeuta
      description: Requiere rol `THERAPIST`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTherapistProfileRequest'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: Requiere rol `ADMIN` o `SUPER_ADMIN` y permiso `users:read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PPage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PLimit'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Estado'
        - $ref: '#/components/parameters/PEstado'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/PRol'
        - $ref: '#/components/parameters/TipoUsuario'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }

  /therapy/approaches:
    get:
      tags: [Therapy public catalog]
      summary: Listar enfoques terapéuticos públicos
      description: Público. Devuelve enfoques activos para catálogo público.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }

  /therapy/products:
    get:
      tags: [Therapy public catalog]
      summary: Listar productos/servicios terapéuticos públicos
      description: Público. Devuelve servicios activos, duración y precios base.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }

  /admin/therapy/approaches:
    get:
      tags: [Admin therapy catalog]
      summary: Listar enfoques terapéuticos administrativos
      description: Requiere `therapy:read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }
    post:
      tags: [Admin therapy catalog]
      summary: Crear enfoque terapéutico
      description: Requiere `therapy:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApproachRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }

  /admin/therapy/approaches/{id}:
    patch:
      tags: [Admin therapy catalog]
      summary: Actualizar enfoque terapéutico
      description: Requiere `therapy:write`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApproachRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }

  /admin/therapy/products:
    get:
      tags: [Admin therapy catalog]
      summary: Listar productos terapéuticos administrativos
      description: Requiere `therapy:read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }
    post:
      tags: [Admin therapy catalog]
      summary: Crear producto terapéutico
      description: Requiere `therapy:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }

  /admin/therapy/products/{id}:
    patch:
      tags: [Admin therapy catalog]
      summary: Actualizar producto terapéutico
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
    delete:
      tags: [Admin therapy catalog]
      summary: Eliminar/desactivar producto terapéutico
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }

  /therapists/me/schedules:
    get:
      tags: [Scheduling]
      summary: Listar horarios recurrentes del terapeuta autenticado
      description: Requiere rol `THERAPIST`. Devuelve los bloques base de atención configurados por día de semana.
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [Scheduling]
      summary: Crear horario recurrente del terapeuta autenticado
      description: Requiere rol `THERAPIST`. Rechaza solapamientos contra horarios activos existentes del mismo terapeuta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleRequest' }
            example:
              weekday: 1
              startTime: '09:00'
              endTime: '13:00'
              timezone: America/La_Paz
              effectiveFrom: '2026-07-01'
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /therapists/me/blocked-times:
    post:
      tags: [Scheduling]
      summary: Crear bloqueo de agenda del terapeuta autenticado
      description: |
        Requiere rol `THERAPIST`.
        Estos bloqueos se descuentan del cálculo público de disponibilidad en `/booking/availability`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlockedTimeRequest' }
            example:
              startAt: '2026-07-10T13:00:00.000-04:00'
              endAt: '2026-07-10T15:00:00.000-04:00'
              reason: Supervisión clínica
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /booking/availability:
    get:
      tags: [Booking]
      summary: Obtener horarios disponibles por terapeuta y producto
      description: |
        Público. Calcula slots disponibles para reservar una cita.

        Algoritmo funcional confirmado:
        1. Busca horarios recurrentes activos del terapeuta en `therapist_schedules`.
        2. Usa la duración del producto terapéutico (`durationMinutes`) para partir el horario en slots.
        3. Descarta slots que se solapan con bloqueos activos de agenda (`therapist_blocked_times`).
        4. Descarta slots que se solapan con citas activas (`appointments` con status `REQUESTED` o `CONFIRMED`).
        5. Cuando existe la vista `v_therapist_unavailable_intervals`, se usa como fuente consolidada de intervalos no disponibles.
        6. Devuelve solo slots libres entre `from` y `to`.

        El rango máximo permitido es de 31 días.
      security: []
      parameters:
        - name: therapistUserId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: ID del usuario terapeuta.
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: ID del producto terapéutico. Define duración del slot.
        - name: from
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-07-01' }
          description: Fecha inicial local incluida.
        - name: to
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-07-14' }
          description: Fecha final local incluida.
        - name: timezone
          in: query
          required: true
          schema: { type: string, example: America/La_Paz }
          description: Zona horaria para interpretar horarios recurrentes.
      responses:
        '200':
          description: Slots disponibles calculados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeObject'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AvailabilityResponse'
              example:
                data:
                  therapistUserId: 7d2f75d0-5298-4a92-87e0-3aa7a4371455
                  productId: 7409c34e-8470-42df-8eb2-83f579d87432
                  slots:
                    - startAt: '2026-07-06T13:00:00.000Z'
                      endAt: '2026-07-06T14:00:00.000Z'
                      timezone: America/La_Paz
                meta:
                  requestId: 2abf44ee-2b5a-4a49-a723-f8bb1639b7bd
                  timestamp: '2026-07-05T15:13:13.536Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /appointments:
    post:
      tags: [Appointments]
      summary: Crear solicitud de cita
      description: |
        Requiere rol `PATIENT`.
        Antes de crear la cita, valida que el slot no esté ocupado por otra cita activa ni bloqueado por agenda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /appointments/mine:
    get:
      tags: [Appointments]
      summary: Listar mis citas
      description: |
        Requiere autenticación.
        Devuelve las citas del usuario autenticado según su rol.
        Acepta paginación canónica `page`/`limit` y aliases legacy `p_page`/`p_limit`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PPage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PLimit'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /appointments/{id}/status:
    patch:
      tags: [Appointments]
      summary: Cambiar estado de una cita
      description: Paciente, terapeuta o admin pueden cambiar estado según reglas del servicio.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAppointmentStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /appointments/admin/list:
    get:
      tags: [Appointments]
      summary: Listar citas desde administración
      description: Requiere rol `ADMIN` o `SUPER_ADMIN` y permiso `appointments:read`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }

  /files:
    post:
      tags: [Files]
      summary: Subir archivo
      description: Requiere autenticación. Soporta almacenamiento local o proveedor configurado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, module]
              properties:
                file:
                  type: string
                  format: binary
                module:
                  type: string
                  enum: [USER_PROFILE, THERAPY_CATALOG, CMS, APPOINTMENT]
                entityType:
                  type: string
                entityId:
                  type: string
                  format: uuid
                visibility:
                  type: string
                  enum: [PRIVATE, PUBLIC]
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }

  /files/{id}/signed-url:
    get:
      tags: [Files]
      summary: Obtener URL firmada o información de descarga
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }

  /files/{id}/download:
    get:
      tags: [Files]
      summary: Descargar archivo local
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Archivo binario.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /public/pages/{slug}:
    get:
      tags: [Public CMS]
      summary: Obtener página pública CMS por slug
      description: Público. Ruta canónica para páginas públicas configurables.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: inicio }
      responses:
        '200': { $ref: '#/components/responses/OkEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /admin/cms/pages:
    post:
      tags: [Admin CMS]
      summary: Crear página CMS
      description: Requiere rol admin y permiso `cms:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCmsPageRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /admin/cms/pages/{pageId}/elements:
    post:
      tags: [Admin CMS]
      summary: Crear elemento de página CMS
      parameters:
        - name: pageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCmsElementRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /publications/news:
    get:
      tags: [Publications public]
      summary: Listar noticias públicas
      description: Público. Devuelve publicaciones de tipo noticia publicadas.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PPage'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PLimit'
        - $ref: '#/components/parameters/PageSize'
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: tagSlug
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: Búsqueda pública por título, resumen o cuerpo.
      responses:
        '200': { $ref: '#/components/responses/PaginatedEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /publications/columns:
    get:
      tags: [Publications public]
