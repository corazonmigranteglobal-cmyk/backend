        name: { type: string }
        description: { type: string }
        context: { type: string, enum: [HOME, ARTICLE, CATEGORY] }
        isActive: { type: boolean }
        dimensions: { type: object, additionalProperties: true }
    UpdateAdsPlacementRequest:
      type: object
      properties:
        code: { type: string, example: home_hero, minLength: 2, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 140 }
        description: { type: string }
        context: { type: string, enum: [HOME, ARTICLE, CATEGORY] }
        isActive: { type: boolean }
        dimensions: { type: object, additionalProperties: true }
    CreateAdsCampaignRequest:
      type: object
      required: [companyId, name, startsAt, endsAt]
