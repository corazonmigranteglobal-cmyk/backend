        destinationUrl: { type: string, format: uri }
        altText: { type: string }
        mimeType: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sizeBytes: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }
    UpdateAdsCreativeRequest:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 180 }
        mediaType: { type: string, enum: [IMAGE, VIDEO, HTML, NATIVE_CARD] }
        fileId: { type: string, format: uuid }
        assetUrl: { type: string, format: uri }
        destinationUrl: { type: string, format: uri }
        altText: { type: string, minLength: 2, maxLength: 220 }
        mimeType: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sizeBytes: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }

    CreateAccountGroupRequest:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
    CreateAccountRequest:
      type: object
      required: [groupId, code, name, normalBalance]
      properties:
        groupId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        normalBalance: { type: string, enum: [DEBIT, CREDIT] }
    CreateCostCenterRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    CreateTransactionRequest:
      type: object
      required: [date, description, entries]
      properties:
        date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        entries:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountId, debit, credit]
            properties:
              accountId: { type: string, format: uuid }
              costCenterId: { type: string, format: uuid }
              debit: { type: number, minimum: 0 }
              credit: { type: number, minimum: 0 }

    CreateUiEventRequest:
      type: object
