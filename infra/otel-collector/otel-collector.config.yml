# OpenTelemetry Collector — staging y producción.
#
# La aplicación exporta SIEMPRE al Collector, nunca directamente a Jaeger:
#  - desacopla el ciclo de vida de Jaeger del de la API,
#  - permite redactar atributos sensibles en un único punto,
#  - absorbe picos con cola en disco en vez de con memoria del backend.
#
# Desplegar en red privada. Nunca publicar 4317/4318 en Internet.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # Restringir a la red interna del despliegue.
        cors:
          allowed_origins: []
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Debe ser el PRIMER procesador: rechaza datos antes de que el Collector se
  # quede sin memoria y muera arrastrando los spans en vuelo.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Segunda barrera de privacidad. La aplicación ya evita generar estos
  # atributos; aquí se eliminan por si una instrumentación futura los reintroduce.
  attributes/redaction:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement.parameters
        action: delete
      - key: url.query
        action: delete
      - key: user.email
        action: delete

  # Descarta trazas de sondas de plataforma que hubieran escapado al filtro de
  # la aplicación (p. ej. peticiones de un balanceador que no pasa por Express).
  filter/health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
        - 'attributes["url.path"] == "/metrics"'
        - 'IsMatch(attributes["url.path"], "^/health(/.*)?$")'

  resource/deployment:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert

  # Último procesador antes de exportar: agrupa spans para reducir round-trips.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/jaeger:
    endpoint: jaeger-collector:4317
    tls:
      insecure: false
      # ca_file: /etc/otel/certs/ca.crt
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000
      # Cola en disco: una caída prolongada de Jaeger no pierde trazas ni
      # consume la memoria del Collector.
      storage: file_storage/queue

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 10s

service:
  extensions: [health_check, file_storage/queue]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/health
        - attributes/redaction
        - resource/deployment
        - batch
      exporters: [otlp/jaeger]
  telemetry:
    logs:
      level: warn
    metrics:
      # Métricas internas del propio Collector (cola, spans descartados).
      # Exponer sólo en la red privada de observabilidad.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
